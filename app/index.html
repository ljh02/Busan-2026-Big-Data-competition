<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BalueWave - 데이터 기반 아파트 매칭 서비스">
    <title>BalueWave 아파트 매칭</title>
    <link rel="icon" href="./assets/baluewave-mark.png">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <section id="recommend" class="workspace anchor-target is-active-view" aria-label="BalueWave 아파트 매칭 화면">
        <aside class="mv-sidebar" aria-label="조건 설정과 매칭 결과">
          <header class="sidebar-brand">
            <span class="brand-mark"><img src="./assets/baluewave-mark.png" alt="" aria-hidden="true" width="123" height="123"></span>
            <div class="brand-copy">
              <strong>BalueWave</strong>
              <span>데이터 기반 아파트 매칭</span>
            </div>
            <div class="header-actions">
              <button id="bookmarkPanelButton" class="header-bookmark-button" type="button" title="즐겨찾기 비교" aria-label="즐겨찾기 아파트 비교 열기">
                <span aria-hidden="true">☆</span>
                <strong id="bookmarkCount">0</strong>
              </button>
              <button id="refreshButton" class="header-refresh-button" type="button" title="추천 새로고침" aria-label="추천 새로고침">
                <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 10.2A8.2 8.2 0 0 1 17.9 5L20 7.1"/>
                  <path d="M20 4.2v4.7h-4.7"/>
                  <path d="M20 13.8A8.2 8.2 0 0 1 6.1 19L4 16.9"/>
                  <path d="M4 19.8v-4.7h4.7"/>
                </svg>
              </button>
            </div>
          </header>

          <section class="sidebar-section controls" aria-label="아파트 조건 설정">
            <fieldset class="segmented budget-mode-selector" aria-label="예산 기준">
              <legend>예산 기준</legend>
              <label><input type="radio" name="budgetMode" value="monthly" checked><span>월세</span></label>
              <label><input type="radio" name="budgetMode" value="jeonse"><span>전세</span></label>
              <label><input type="radio" name="budgetMode" value="sale"><span>매매</span></label>
            </fieldset>

            <label class="field">
              <span id="budgetLabel">월 주거 예산</span>
              <span class="budget-input-wrap">
                <input id="budgetOutput" class="budget-number-input" type="number" min="0" max="150" step="1" value="0" inputmode="decimal" aria-label="월 주거 예산">
                <span id="budgetUnit">만원</span>
              </span>
              <input id="budgetInput" type="range" min="0" max="150" value="0" step="1">
            </label>

            <label class="field destination-search-field">
              <span>목적지</span>
              <span class="search-input-wrap">
                <input
                  id="destinationInput"
                  type="text"
                  value=""
                  autocomplete="off"
                  aria-autocomplete="list"
                  aria-controls="destinationSuggestions"
                  placeholder="주소를 입력하세요.">
                <button id="destinationClearButton" class="search-clear-button" type="button" aria-label="목적지 입력 지우기" hidden>×</button>
                <div id="destinationSuggestions" class="location-suggestions" role="listbox" hidden></div>
              </span>
              <small id="destinationValidation" class="field-hint destination-validation" aria-live="polite"></small>
            </label>

            <fieldset class="segmented persona-selector" aria-label="가구 유형">
              <legend>가구 유형</legend>
              <label><input type="radio" name="persona" value="single" checked><span>1인 가구</span></label>
              <label><input type="radio" name="persona" value="newlywed"><span>신혼</span></label>
              <label><input type="radio" name="persona" value="family"><span>자녀 가구</span></label>
              <label><input type="radio" name="persona" value="senior"><span>노인</span></label>
            </fieldset>

            <div class="weights" aria-label="가중치 설정">
              <div class="weight-title">
                <strong>매칭 가중치</strong>
              </div>
              <label class="field compact" title="목적지까지의 대중교통 통근 시간을 점수화합니다.">
                <span>통근</span>
                <output id="commuteWeightOutput">30%</output>
                <input id="commuteWeight" type="range" min="0" max="50" value="30" step="5">
              </label>
              <label class="field compact" title="선택한 예산 기준 대비 아파트 단지 가격을 점수화합니다.">
                <span>주거비</span>
                <output id="costWeightOutput">35%</output>
                <input id="costWeight" type="range" min="0" max="50" value="35" step="5">
              </label>
              <label class="field compact" title="병원, 학교, 공원 접근성을 반영합니다.">
                <span>생활 SOC</span>
                <output id="serviceWeightOutput">15%</output>
                <input id="serviceWeight" type="range" min="0" max="50" value="15" step="5">
              </label>
              <label class="field compact" title="치안시설, CCTV, 대기질, 녹지 접근성을 반영합니다.">
                <span>안전</span>
                <output id="safetyWeightOutput">20%</output>
                <input id="safetyWeight" type="range" min="0" max="50" value="20" step="5">
              </label>
            </div>
            <button id="matchButton" class="primary-button match-button" type="button">매칭하기</button>
          </section>

          <section class="sidebar-section recommendation" aria-label="추천 결과">
            <div class="section-title compact-title">
              <div>
                <p class="eyebrow">추천 랭킹</p>
                <h2>매칭 결과</h2>
              </div>
              <span id="resultSummary" class="muted"></span>
            </div>
            <div id="cards" class="cards"></div>
            <button id="toggleCards" class="ghost-button" type="button" hidden>더보기</button>
            <p id="updatedAt" class="muted refresh-note"></p>
          </section>

        </aside>

        <div id="sidebarResizeHandle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="사이드바 크기 조절" tabindex="0"></div>

        <aside id="detailSubpanel" class="mv-subpanel" aria-label="선택 아파트 상세" hidden>
          <header class="subpanel-header">
            <button id="closeSubpanelButton" class="subpanel-icon-button" type="button" aria-label="상세 패널 닫기">‹</button>
            <div class="subpanel-title-block">
              <strong id="selectedBadge">선택 없음</strong>
              <span id="subpanelMeta" class="subpanel-meta">매칭 결과를 선택하세요</span>
            </div>
            <button id="subpanelCloseXButton" class="subpanel-icon-button" type="button" aria-label="상세 패널 닫기">×</button>
          </header>

          <nav class="subpanel-tabs" role="tablist" aria-label="아파트 상세 메뉴">
            <button id="matchingResultTab" class="subpanel-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="matchingResultPanel" data-subpanel-tab="matching">매칭 결과</button>
            <button id="apartmentInfoTab" class="subpanel-tab" type="button" role="tab" aria-selected="false" aria-controls="apartmentInfoPanel" data-subpanel-tab="apartment">아파트 정보</button>
            <button id="commuteRouteTab" class="subpanel-tab" type="button" role="tab" aria-selected="false" aria-controls="commuteRoutePanel" data-subpanel-tab="route">출퇴근 경로</button>
            <button id="infrastructureTab" class="subpanel-tab" type="button" role="tab" aria-selected="false" aria-controls="infrastructurePanel" data-subpanel-tab="infrastructure">주변 인프라</button>
            <button id="jeonseRiskTab" class="subpanel-tab" type="button" role="tab" aria-selected="false" aria-controls="jeonseRiskPanel" data-subpanel-tab="jeonseRisk">전세 위험 점검</button>
          </nav>

          <div class="subpanel-scroll">
            <section id="matchingResultPanel" class="subpanel-section" role="tabpanel" aria-labelledby="matchingResultTab" data-subpanel-panel="matching">
              <div id="detailContent" class="detail-content"></div>
            </section>

            <section id="apartmentInfoPanel" class="subpanel-section" role="tabpanel" aria-labelledby="apartmentInfoTab" data-subpanel-panel="apartment" hidden>
              <div id="propertyDashboard" class="property-dashboard map-property-drawer" aria-live="polite"></div>
            </section>

            <section id="commuteRoutePanel" class="subpanel-section" role="tabpanel" aria-labelledby="commuteRouteTab" data-subpanel-panel="route" hidden>
              <div id="routeContent" class="route-content"></div>
            </section>

            <section id="infrastructurePanel" class="subpanel-section" role="tabpanel" aria-labelledby="infrastructureTab" data-subpanel-panel="infrastructure" hidden>
              <div id="infrastructureContent" class="infrastructure-content"></div>
            </section>

            <section id="jeonseRiskPanel" class="subpanel-section" role="tabpanel" aria-labelledby="jeonseRiskTab" data-subpanel-panel="jeonseRisk" hidden>
              <div id="jeonseRiskContent" class="property-dashboard map-property-drawer" aria-live="polite"></div>
            </section>
          </div>

          <div
            id="subpanelResizer"
            class="subpanel-resizer"
            role="separator"
            aria-orientation="vertical"
            aria-label="상세 패널 너비 조절"
            tabindex="0"
            title="드래그해서 너비 조절 · 더블클릭하면 기본값"></div>
        </aside>

        <section class="map-stage" aria-label="아파트 지도">
          <div class="map-canvas" id="mapCanvas" role="region" aria-label="추천 아파트와 대중교통 경로 지도"></div>

          <button
            id="agentLauncher"
            class="agent-launcher"
            type="button"
            aria-label="AI Agent 대화 열기"
            aria-expanded="false"
            aria-controls="agentPanel">
            <img
              class="agent-character-icon"
              src="./assets/baluewave-character-sm.png"
              alt=""
              aria-hidden="true"
              width="86"
              height="128">
            <span>AI Agent</span>
          </button>

          <aside id="bookmarkPanel" class="bookmark-panel" aria-label="즐겨찾기 아파트 비교" aria-live="polite" hidden></aside>

          <aside id="agentPanel" class="agent-panel" aria-label="AI Agent 대화" hidden>
            <header class="agent-panel-head">
              <img class="agent-panel-avatar" src="./assets/baluewave-character.png" alt="" aria-hidden="true">
              <div class="agent-panel-title">
                <strong>BalueWave AI Agent</strong>
                <span id="agentContextLabel" class="agent-context"></span>
              </div>
              <div class="agent-panel-actions">
                <button id="agentResetButton" class="agent-icon-button" type="button" title="대화 초기화" aria-label="대화 초기화">&#8635;</button>
                <button id="agentCloseButton" class="agent-icon-button" type="button" title="닫기" aria-label="AI Agent 대화 닫기">&times;</button>
              </div>
            </header>
            <div id="agentThread" class="agent-thread" role="log" aria-live="polite"></div>
            <div id="agentFollowUps" class="agent-followups"></div>
            <form id="agentForm" class="agent-composer">
              <input
                id="agentInput"
                type="text"
                autocomplete="off"
                placeholder="전세 안전성, 깡통 여부, 확인 서류 등을 물어보세요."
                aria-label="AI Agent 질문 입력">
              <button class="primary-button compact-button" type="submit">전송</button>
            </form>
          </aside>
        </section>
      </section>
    </main>

    <template id="cardTemplate">
      <article class="result-card">
        <button class="card-button" type="button">
          <span class="rank"></span>
          <span class="card-main">
            <strong class="name"></strong>
            <span class="card-meta"></span>
          </span>
        </button>
        <button class="card-bookmark-button" type="button" aria-label="즐겨찾기 추가" title="즐겨찾기">☆</button>
      </article>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
